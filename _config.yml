title: "My Space"
description: "Personal space covering notes, study group, cycling, and papers"
baseurl: "" # For user.github.io repo, leave this empty
url: "https://zhangyulin-space.github.io"
theme: minima

markdown: kramdown
highlighter: rouge

permalink: pretty

# Navigation links
collections:
  notes:
    output: true
    permalink: /notes/:path/

defaults:
  - scope:
      path: ""
      type: "notes"
    values:
      layout: "default"

plugins:
  - jekyll-feed
  - jekyll-seo-tag